<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Para ti 💛</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
font-family:Georgia,'Times New Roman',serif;
background:radial-gradient(circle at 50% 35%,#fffde7 0,#fff3a6 32%,#f7c94b 70%,#d99016 100%);
display:flex;align-items:center;justify-content:center;color:#704500
}
#stars,.petals,.hearts{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;color:#fff7a8;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.15;transform:scale(.7)}to{opacity:1;transform:scale(1.3)}}
.card{
position:relative;width:min(92vw,650px);min-height:620px;padding:42px 25px 25px;
text-align:center;border-radius:35px;
background:rgba(255,255,255,.25);backdrop-filter:blur(7px);
box-shadow:0 20px 70px rgba(115,70,0,.25);border:1px solid rgba(255,255,255,.55);
animation:appear 1.5s ease both
}
@keyframes appear{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
h1{font-size:clamp(42px,10vw,78px);margin:0;color:#9b5e00;text-shadow:0 3px 0 #fff4a8;animation:title 2s ease-in-out infinite alternate}
@keyframes title{to{transform:translateY(-4px)}}
.message{font-size:clamp(20px,4.8vw,30px);line-height:1.45;margin:12px auto 4px;max-width:560px}
.sub{font-family:Arial,sans-serif;font-size:15px;opacity:.75}
.bouquet{height:270px;position:relative;margin:15px auto 0;width:310px}
.flower{position:absolute;width:120px;height:120px;left:95px;top:15px;animation:sway 3.2s ease-in-out infinite;transform-origin:50% 100%}
.flower:nth-child(2){left:20px;top:65px;transform:scale(.78) rotate(-13deg);animation-delay:.5s}
.flower:nth-child(3){left:170px;top:70px;transform:scale(.8) rotate(13deg);animation-delay:.9s}
@keyframes sway{0%,100%{rotate:-3deg}50%{rotate:4deg}}
.petal{position:absolute;left:39px;top:3px;width:44px;height:70px;border-radius:55% 55% 45% 45%;background:#ffd21f;box-shadow:0 2px 5px #b87900;transform-origin:22px 57px}
.petal:nth-child(2){transform:rotate(45deg)}.petal:nth-child(3){transform:rotate(90deg)}
.petal:nth-child(4){transform:rotate(135deg)}.petal:nth-child(5){transform:rotate(180deg)}
.petal:nth-child(6){transform:rotate(225deg)}.petal:nth-child(7){transform:rotate(270deg)}
.petal:nth-child(8){transform:rotate(315deg)}
.center{position:absolute;left:44px;top:45px;width:34px;height:34px;border-radius:50%;background:#7c4b00;border:5px solid #a96800;z-index:3}
.stem{position:absolute;left:56px;top:105px;width:8px;height:160px;background:#4c9434;border-radius:9px;z-index:-1}
.leaf{position:absolute;left:2px;top:165px;width:70px;height:30px;background:#65a83d;border-radius:100% 0;transform:rotate(-25deg)}
.leaf.r{left:55px;transform:scaleX(-1) rotate(-25deg)}
.heart{position:fixed;bottom:-40px;font-size:25px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.fall{position:fixed;top:-50px;font-size:25px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg);opacity:.1}}
button{
border:0;border-radius:999px;padding:14px 25px;font-size:17px;font-weight:bold;
background:#d99016;color:white;box-shadow:0 7px 18px #8c590055;cursor:pointer;
transition:.25s
}
button:hover{transform:scale(1.06);background:#b97000}
#extra{max-height:0;overflow:hidden;transition:1s ease;font-size:20px;margin-top:0}
#extra.open{max-height:100px;margin-top:15px}
</style>
</head>
<body>
<div id="stars"></div><div class="petals"></div><div class="hearts"></div>
<main class="card">
<h1>🌻 Para ti 💛</h1>
<div class="message">Que estas flores amarillas te recuerden lo especial que eres.</div>
<div class="sub">Un pequeño detalle, hecho con mucho cariño ✨</div>

<div class="bouquet">
  <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div>
    <i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b>
  </div>
  <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div>
    <i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b>
  </div>
  <div class="flower"><div class="stem"></div><div class="leaf"></div><div class="leaf r"></div>
    <i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b>
  </div>
</div>

<button onclick="document.getElementById('extra').classList.toggle('open'); burst()">✨ Presiona aquí ✨</button>
<div id="extra">Y si pudiera, te regalaría un campo entero de flores amarillas. 💛🌻</div>
</main>
<script>
const stars=document.getElementById('stars');
for(let i=0;i<35;i++){let s=document.createElement('span');s.className='star';s.textContent='✦';s.style.left=Math.random()*100+'vw';s.style.top=Math.random()*100+'vh';s.style.fontSize=8+Math.random()*14+'px';s.style.animationDelay=Math.random()*2+'s';stars.appendChild(s)}
const petals=document.querySelector('.petals');
for(let i=0;i<22;i++){let p=document.createElement('span');p.className='fall';p.textContent=['🌼','🌻'][Math.random()>.5?1:0];p.style.left=Math.random()*100+'vw';p.style.animationDuration=6+Math.random()*8+'s';p.style.animationDelay=-Math.random()*10+'s';p.style.fontSize=14+Math.random()*18+'px';petals.appendChild(p)}
function burst(){for(let i=0;i<18;i++){let h=document.createElement('span');h.className='heart';h.textContent=['💛','✨','🌻'][Math.floor(Math.random()*3)];h.style.left=(40+Math.random()*20)+'vw';h.style.animationDuration=(2+Math.random()*2)+'s';h.style.fontSize=(18+Math.random()*20)+'px';document.querySelector('.hearts').appendChild(h);setTimeout(()=>h.remove(),4500)}}
</script>
</body>
</html>
